name: "Padelbot"
version: "0.1.0"
slug: "padelbot"
description: "WhatsApp-assistent voor de padelgroep: aankondiging, peiling, team en historiek"
url: "https://github.com/frederic1967/padelbot"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:tennis
panel_title: Padelbot
homeassistant_api: true
options:
  groep_naam: "Padel test"
  tijdstip: "18:00"
  tijdzone: "Europe/Brussels"
  melding_service: "persistent_notification.create"
schema:
  groep_naam: str
  tijdstip: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  tijdzone: str
  melding_service: str
  bot_telefoonnummer: "match(^\\+?[0-9 ]{8,20}$)?"
  laatste_herlading: "match(^[0-9]{4}-[0-9]{2}-[0-9]{2}$)?"
