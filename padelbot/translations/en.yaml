configuration:
  groep_naam:
    name: WhatsApp group name
    description: Exactly as the group is named in WhatsApp.
  tijdstip:
    name: Message time
    description: Time of the Tuesday, Wednesday and Thursday messages (e.g. 18:00).
  tijdzone:
    name: Time zone
    description: Keep Europe/Brussels.
  melding_service:
    name: Admin notifications
    description: Home Assistant action for alerts, e.g. persistent_notification.create or notify.mobile_app_your_phone.
  bot_telefoonnummer:
    name: Bot phone number (optional)
    description: Fill in to link with a pairing code instead of a QR code.
  laatste_herlading:
    name: Last eSIM top-up (optional)
    description: Date of activation or last top-up (YYYY-MM-DD). The bot reminds you 30, 14 and 3 days before the number expires.
  geldigheid_maanden:
    name: eSIM validity (months)
    description: How long the number stays active after a top-up. DIGI prepaid = 9 months.
  uitgebreide_log:
    name: Detailed log
    description: Turn on to troubleshoot. Writes many technical details to the log; turn off again afterwards.
