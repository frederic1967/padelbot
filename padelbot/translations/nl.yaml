configuration:
  groep_naam:
    name: Naam van de WhatsApp-groep
    description: Exact zoals de groep in WhatsApp heet. Begin met de naam van je testgroep.
  tijdstip:
    name: Tijdstip van de berichten
    description: Uur voor de berichten op dinsdag, woensdag en donderdag (bv. 18:00).
  tijdzone:
    name: Tijdzone
    description: Laat op Europe/Brussels staan.
  melding_service:
    name: Meldingen voor de beheerder
    description: >-
      Home Assistant-actie voor waarschuwingen. Standaard een melding in Home Assistant
      (persistent_notification.create). Voor een pushmelding bv. notify.mobile_app_jouw_telefoon.
  bot_telefoonnummer:
    name: Telefoonnummer van de bot (optioneel)
    description: >-
      Vul in (bv. +32470123456) om te koppelen met een code in plaats van een QR-code.
      Handig als je Home Assistant op dezelfde telefoon bekijkt.
  laatste_herlading:
    name: Laatste herlading eSIM (optioneel)
    description: Datum van activatie of laatste herlading (JJJJ-MM-DD). De bot herinnert je 30, 14 en 3 dagen voor het nummer vervalt.
  geldigheid_maanden:
    name: Geldigheid van de eSIM (maanden)
    description: Hoe lang het nummer actief blijft na een herlading. DIGI prepaid = 9 maanden.
  uitgebreide_log:
    name: Uitgebreide log
    description: Zet aan om problemen op te sporen. Schrijft veel technische details in de log; zet daarna weer uit.
